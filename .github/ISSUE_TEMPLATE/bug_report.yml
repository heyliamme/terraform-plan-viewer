name: Bug report
description: A plan that doesn't open, a change shown wrongly, a crash, or something that looks off
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: The plan
      description: The smallest plan (JSON from `terraform show -json`, or the text output) that shows the problem. Redact anything private first; the output of "Copy as Markdown" with masking on helps too.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: OS, VS Code (or other editor), the extension, and Terraform or OpenTofu
    validations:
      required: true
